plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_artifact_name
}

def configuredRunDirectory = project.findProperty('runDirectory') ?: 'run'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file(
            'src/main/resources/META-INF/accesstransformer.cfg'
    )

    runs {
        configureEach {
            workingDirectory project.file(configuredRunDirectory)
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (!project.hasProperty('skipGameTests')) {
                property 'forge.enabledGameTestNamespaces', mod_id
            }
        }

        server {
            if (!project.hasProperty('skipGameTests')) {
                property 'forge.enabledGameTestNamespaces', mod_id
            }
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processResources', ProcessResources).configure {
    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/items') {
        include 'phial.png', 'essence.png'
        into 'assets/thaumcraftmodern/textures/item'
    }
    from(zipTree('reference/original/Thaumcraft_1.7.10_4.2.3.5.jar')) {
        include 'assets/thaumcraft/textures/items/bauble_amulet.png',
                'assets/thaumcraft/textures/items/bauble_ring.png',
                'assets/thaumcraft/textures/items/bauble_belt.png',
                'assets/thaumcraft/textures/items/bauble_ring_iron.png',
                'assets/thaumcraft/textures/items/vis_amulet.png',
                'assets/thaumcraft/textures/items/vis_amulet.png.mcmeta',
                'assets/thaumcraft/textures/items/vis_amulet_lesser.png',
                'assets/thaumcraft/textures/items/runic_*.png',
                'assets/thaumcraft/textures/items/runic_*.png.mcmeta'
        eachFile { details ->
            details.path = details.path.replace(
                    'assets/thaumcraft/textures/items/',
                    'assets/thaumcraftmodern/textures/item/')
        }
        includeEmptyDirs = false
    }
}

tasks.named('processResources', ProcessResources).configure {
    from(zipTree('reference/original/Thaumcraft_1.7.10_4.2.3.5.jar')) {
        include 'assets/thaumcraft/textures/models/hemis*.png',
                'assets/thaumcraft/textures/models/hemis*.png.mcmeta',
                'assets/thaumcraft/textures/misc/r_runicupg.png',
                'assets/thaumcraft/sounds/runicShieldEffect.ogg',
                'assets/thaumcraft/sounds/runicShieldCharge.ogg'
        eachFile { details ->
            details.path = details.path
                    .replace('assets/thaumcraft/textures/models/',
                            'assets/thaumcraftmodern/textures/models/')
                    .replace('assets/thaumcraft/textures/misc/',
                            'assets/thaumcraftmodern/textures/misc/')
                    .replace('assets/thaumcraft/sounds/runicShieldEffect.ogg',
                            'assets/thaumcraftmodern/sounds/runic_shield_effect.ogg')
                    .replace('assets/thaumcraft/sounds/runicShieldCharge.ogg',
                            'assets/thaumcraftmodern/sounds/runic_shield_charge.ogg')
        }
        includeEmptyDirs = false
    }
}

