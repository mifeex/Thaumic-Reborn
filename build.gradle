tasks.named('processResources', ProcessResources).configure {
    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/items') {
        include 'elementalpick.png', 'elementalaxe.png', 'elementalsword.png',
                'elementalshovel.png', 'elementalhoe.png', 'bootstraveler.png'
        into 'assets/thaumcraftmodern/textures/item'
    }
    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/models') {
        include 'bootstraveler.png'
        into 'assets/thaumcraftmodern/textures/models'
    }
    from('reference/Thaumcraft-4.2-FOREVA-master/thaumcraft_src/assets/thaumcraft/sounds') {
        include 'wandfail.ogg', 'wind1.ogg', 'wind2.ogg', 'swing1.ogg', 'swing2.ogg'
        into 'assets/thaumcraftmodern/sounds'
    }
}

repositories {
    maven {
        name = 'Illusive Soulworks maven'
        url = 'https://maven.theillusivec4.top/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    testCompileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/blocks') {
        include 'urn_*.png', 'crate_*.png'
        into 'assets/thaumcraftmodern/textures/block'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_artifact_name}-${mod_version}.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
